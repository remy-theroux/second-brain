# The suffix comes from the `.env` of the current directory and is empty in the main repository.
# It is what separates the stacks: containers, network and named volumes are all prefixed
# with this project name, so two worktrees share neither database nor node_modules.
name: second-brain${STACK_SUFFIX:-}

services:
  proxy:
    image: traefik:v3
    command:
      # The routing is read from the containers' labels, nothing else.
      - --providers.docker=true
      # Without this, db and mailpit would end up routed without having asked for it.
      - --providers.docker.exposedByDefault=false
      # The Docker provider reads the whole socket, not only the stack that started it. Without
      # this constraint, two worktrees launched in parallel give two Traefik instances that each
      # see the four labelled containers, hence two routers named `backend` and two
      # named `frontend`: a collision, and a request goes to the wrong feature.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`second-brain${STACK_SUFFIX:-}`)
      - --entryPoints.web.address=:80
    ports:
      # The only published port of the application: it is the single origin the browser sees,
      # in development as in production, where Coolify plays this role.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    # pgvector/pgvector and not postgres:17-alpine: the `vector` extension must be provided
    # by the image, migration V9 takes care of enabling it. Version pinned like the rest
    # of the stack. Debian and not Alpine: that is what pgvector publishes — a db-data volume
    # initialised by the former image is to be thrown away (`docker compose down -v`), musl and glibc
    # do not sort text the same way.
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
      POSTGRES_USER: ${POSTGRES_USER:-second_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-second_brain} -d ${POSTGRES_DB:-second_brain}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # SMTP for the application, web interface to read the captured mails.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # Administrator account of the broker, created at first startup in place of `guest`
      # (the image does not create `guest` when these two variables are set). The image makes
      # the account reachable from the whole network, and Docker publishes the ports on all
      # interfaces: this is a development secret, of the same rank as POSTGRES_PASSWORD.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-second_brain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-second_brain}
      # The worker holds a single AMQP delivery for the whole time the vectorisation
      # of a document takes, potentially several minutes. The broker's default
      # (30 minutes) is reachable on a large document, and a broker that
      # exceeds this delay closes the channel — which requeues the message whatever
      # `default-requeue-rejected` says, a setting that only governs `basicNack`, not a
      # channel closure. The document would start over from zero, indefinitely, with the single
      # consumer stuck on it. Two hours cover a wide margin without masking a real blockage.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 7200000"
    ports:
      # AMQP for the application, management console to watch the messages go by. Same
      # status as Mailpit: a development tool, not routed by Traefik.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_WEB_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    # `latest` and not a pinned version, same status as mailpit: a development
    # tool, not a component whose version decides a behaviour of the product.
    image: ollama/ollama:latest
    volumes:
      # The models weigh gigabytes: a named volume, never the bind mount.
      - ollama-models:/root/.ollama
    healthcheck:
      # `ollama list` answers as soon as the server listens, without downloading anything.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 30s
      retries: 10
    # No published port, unlike db, rabbitmq and mailpit. Two reasons: only the
    # worker talks to it, from the stack's network; and one more port would have to enter
    # the index offsetting of the `worktree` skill, without which two features would fight over it.
    # To query it by hand: `docker compose exec ollama ollama list`.

  ollama-pull:
    image: ollama/ollama:latest
    # A client, not a server: OLLAMA_HOST makes it talk to the neighbouring container, which
    # downloads into ITS volume. The puller therefore has no volume to mount.
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3} && ollama pull ${SECONDBRAIN_LLM_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    # It pulls the model and stops. `no` is already Compose's default — the line changes
    # nothing, it says explicitly that a container that stops after pulling the model
    # is expected, for whoever would read this file thinking that a service that stops is a
    # failure to fix.
    restart: "no"

  garage:
    # Version pinned like `db` and `rabbitmq`, not floating like `mailpit`: this is
    # not a development tool, it is the component whose S3 compatibility decides the
    # behaviour of the storage adapter.
    image: dxflrs/garage:v2.3.0
    environment:
      # Credentials of the object storage of the original files. Garage requires an identifier
      # of at least 8 characters [A-Za-z0-9-_.] and a secret of at least 16 graphic ASCII
      # characters: below that, it refuses to create the key and the container does not start — the
      # message is in `garage`'s logs, not in the app's. Development
      # secrets, of the same rank as POSTGRES_PASSWORD, never to be reused elsewhere.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
      # Bucket name following the S3 rules: lowercase and hyphens, never an underscore.
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-second-brain-originals}
    # The image has no ENTRYPOINT (its default Cmd is already ["/garage", "server"]):
    # a `command:` without the binary's path goes looking for "server" in the PATH
    # and fails. --single-node: without it a fresh node has no layout and refuses any
    # write. --default-access-key and --default-bucket (Garage v2.3.0) create the key and
    # the bucket from the three variables above, which does away with a bootstrap
    # container.
    command: ["/garage", "server", "--single-node", "--default-access-key", "--default-bucket"]
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # Image built on `scratch`: no shell, no curl, no wget, the only executable is the
      # binary itself. Hence CMD and not CMD-SHELL.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port: only `app` and `worker` talk to it, from the stack's
    # network. One more port would enter the index offsetting of the `worktree` skill
    # (see CLAUDE.md, section « Plusieurs features en parallèle »), without which two
    # features would fight over it. To look inside by hand:
    # docker compose exec garage /garage bucket info second-brain-originals

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-second_brain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-second_brain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-second_brain}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-second_brain}
      SECONDBRAIN_BASE_URL: http://localhost:${HTTP_PORT:-8080}
      SECONDBRAIN_JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-second-brain-32-octets}
      SECONDBRAIN_DRIVE_TOKEN_KEY: ${SECONDBRAIN_DRIVE_TOKEN_KEY:-Y2xlLWRlLWRldmVsb3BwZW1lbnQtZHJpdmUtc2Vjb25kYnJhaW4=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OLLAMA_BASE_URL: http://ollama:11434
      SECONDBRAIN_EMBEDDING_MODEL: ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3}
      SECONDBRAIN_LLM_MODEL: ${SECONDBRAIN_LLM_MODEL:-qwen3:4b}
      # Endpoint hard-coded on the service name, like the other internal addresses of this
      # file. The three other variables copy what Garage received to create its
      # default key and bucket (see the `garage` service).
      SECONDBRAIN_S3_ENDPOINT: http://garage:3900
      SECONDBRAIN_S3_BUCKET: ${S3_BUCKET:-second-brain-originals}
      SECONDBRAIN_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      SECONDBRAIN_S3_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
    labels:
      - "traefik.enable=true"
      # /verification and /drive are outside /api on purpose: both are navigations, not XHR
      # calls — the first arrives from a mail client, the second from Google. Forgetting
      # /drive here sends the OAuth callback to the front, which answers its index.html and
      # the connection fails without a word.
      # Swagger and actuator are routed here because this file describes a development
      # environment; in production the proxy only exposes /api and /verification.
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/verification`) || PathPrefix(`/drive`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # Explicit priority: do not depend on Traefik's rule-length computation.
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    volumes:
      # Source mounted for the hot reload (Gradle --continuous + DevTools).
      - ./:/workspace
      # Gradle cache isolated in a named volume (not written on the host).
      - gradle-cache:/workspace/.gradle-cache
    healthcheck:
      # Healthy = Tomcat is listening, hence build/classes is compiled and loaded. Bash and /dev/tcp
      # rather than curl, which the temurin image does not necessarily ship. The first startup
      # downloads Gradle and the dependencies: generous retries rather than a start_period.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 90
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # An upload without storage fails immediately: the application has no business
      # being up before Garage is.
      garage:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Same image as `app`, second process, role decided by the profile. The worker NEVER
    # compiles: `-x compileJava -x processResources` removes the only tasks that would write
    # into build/. It is `app` that writes this directory, continuously, and the worker merely
    # reads from it — the two Gradle processes therefore no longer share any modifiable output, and
    # DevTools restarts the worker on the .class that `app` has just recompiled.
    # The --project-cache-dir isolates the .gradle/ project directory that `app` locks
    # (spec, decision 9); that is not enough on its own, because the two containers would still
    # share GRADLE_USER_HOME (gradle-cache) and would block on its journal lock —
    # the contention goes through a local port, invisible from the other container. Hence the second
    # volume below. Finally, a healthy `app` (see its healthcheck) guarantees that build/classes
    # exists before the worker starts: the « Main class name has not been
    # configured » race can no longer reach it.
    command: ["./gradlew", "--no-daemon", "--project-cache-dir", ".gradle-worker", "bootRun", "-x", "compileJava", "-x", "processResources"]
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-second_brain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-second_brain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-second_brain}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-second_brain}
      SECONDBRAIN_BASE_URL: http://localhost:${HTTP_PORT:-8080}
      SECONDBRAIN_JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-second-brain-32-octets}
      SECONDBRAIN_DRIVE_TOKEN_KEY: ${SECONDBRAIN_DRIVE_TOKEN_KEY:-Y2xlLWRlLWRldmVsb3BwZW1lbnQtZHJpdmUtc2Vjb25kYnJhaW4=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OLLAMA_BASE_URL: http://ollama:11434
      SECONDBRAIN_EMBEDDING_MODEL: ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3}
      SECONDBRAIN_LLM_MODEL: ${SECONDBRAIN_LLM_MODEL:-qwen3:4b}
      SECONDBRAIN_S3_ENDPOINT: http://garage:3900
      SECONDBRAIN_S3_BUCKET: ${S3_BUCKET:-second-brain-originals}
      SECONDBRAIN_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      SECONDBRAIN_S3_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
      # Its own Gradle cache: two containers sharing a GRADLE_USER_HOME block
      # on its locks (the contention goes through a local port, invisible from the other
      # container). Price: a second download of the dependencies at first startup.
      GRADLE_USER_HOME: /workspace/.gradle-cache-worker
    volumes:
      - ./:/workspace
      - gradle-cache-worker:/workspace/.gradle-cache-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # An upload without storage fails immediately: the application has no business
      # being up before Garage is.
      garage:
        condition: service_healthy
      app:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    # npm ci and not npm install: the lock is the reference, and it is not rewritten in
    # the mounted repository. node_modules lives in a named volume, not in the bind mount —
    # otherwise the tree installed in the container would overwrite the host's.
    command: sh -c "npm ci && npm run dev"
    environment:
      # The hot reload client connects to the public origin, not to the container's
      # 5173, which is no longer published.
      VITE_PUBLIC_PORT: ${HTTP_PORT:-8080}
    labels:
      - "traefik.enable=true"
      # Catch-all: everything the back end has not claimed is a path of the SPA.
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - app

volumes:
  db-data:
  gradle-cache:
  gradle-cache-worker:
  ollama-models:
  garage-meta:
  garage-data:
  frontend-node-modules:
