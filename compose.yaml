# Le suffixe vient du `.env` du répertoire courant et vaut vide dans le dépôt principal.
# C'est lui qui sépare les piles : conteneurs, réseau et volumes nommés sont tous préfixés
# par ce nom de projet, donc deux worktrees ne partagent ni base ni node_modules.
name: second-brain${STACK_SUFFIX:-}

services:
  proxy:
    image: traefik:v3
    command:
      # Le routage se lit sur les labels des conteneurs, rien d'autre.
      - --providers.docker=true
      # Sans ça, db et mailpit se retrouveraient routés sans l'avoir demandé.
      - --providers.docker.exposedByDefault=false
      # Le provider Docker lit tout le socket, pas seulement la pile qui l'a démarré. Sans
      # cette contrainte, deux worktrees lancés en parallèle donnent deux Traefik qui voient
      # chacun les quatre conteneurs étiquetés, donc deux routeurs nommés `backend` et deux
      # nommés `frontend` : collision, et une requête part chez la mauvaise feature.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`second-brain${STACK_SUFFIX:-}`)
      - --entryPoints.web.address=:80
    ports:
      # Seul port publié de l'application : c'est l'unique origine que voit le navigateur,
      # en développement comme en production, où Coolify tient ce rôle.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    # pgvector/pgvector et non postgres:17-alpine : l'extension `vector` doit être fournie
    # par l'image, la migration V9 se charge de l'activer. Version épinglée comme le reste
    # de la pile. Debian et non Alpine : c'est ce que publie pgvector — un volume db-data
    # initialisé par l'ancienne image se jette (`docker compose down -v`), musl et glibc ne
    # trient pas le texte de la même façon.
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
      POSTGRES_USER: ${POSTGRES_USER:-second_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-second_brain} -d ${POSTGRES_DB:-second_brain}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # SMTP pour l'application, interface web pour lire les mails capturés.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # Compte administrateur du broker, créé au premier démarrage à la place de `guest`
      # (l'image ne crée pas `guest` quand ces deux variables sont posées). L'image rend
      # le compte joignable depuis tout le réseau, et Docker publie les ports sur toutes
      # les interfaces : c'est un secret de développement, du même rang que POSTGRES_PASSWORD.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-second_brain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-second_brain}
      # Le worker tient une seule livraison AMQP pendant tout le temps que prend la
      # vectorisation d'un document, potentiellement plusieurs minutes. Le défaut du
      # broker (30 minutes) est atteignable sur un document volumineux, et un broker qui
      # dépasse ce délai ferme le canal — ce qui remet le message en file quoi que dise
      # `default-requeue-rejected`, réglage qui ne gouverne que `basicNack`, pas une
      # fermeture de canal. Le document repartirait de zéro, indéfiniment, avec l'unique
      # consommateur bloqué dessus. Deux heures couvrent large sans masquer un vrai blocage.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 7200000"
    ports:
      # AMQP pour l'application, console de gestion pour voir passer les messages. Même
      # statut que Mailpit : un outil de développement, pas routé par Traefik.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_WEB_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    # `latest` et non une version épinglée, même statut que mailpit : un outil de
    # développement, pas un composant dont la version décide d'un comportement du produit.
    image: ollama/ollama:latest
    volumes:
      # Les modèles pèsent des gigaoctets : un volume nommé, jamais le bind mount.
      - ollama-models:/root/.ollama
    healthcheck:
      # `ollama list` répond dès que le serveur écoute, sans rien télécharger.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 30s
      retries: 10
    # Aucun port publié, à la différence de db, rabbitmq et mailpit. Deux raisons : seul le
    # worker lui parle, depuis le réseau de la pile ; et un port de plus devrait entrer dans
    # le décalage d'indices du skill `worktree`, sans quoi deux features se le disputeraient.
    # Pour l'interroger à la main : `docker compose exec ollama ollama list`.

  ollama-pull:
    image: ollama/ollama:latest
    # Un client, pas un serveur : OLLAMA_HOST le fait parler au conteneur voisin, qui
    # télécharge dans SON volume. Le puller n'a donc aucun volume à monter.
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy
    # Il tire le modèle et s'arrête. `no` est déjà le défaut de Compose — la ligne ne change
    # rien, elle dit explicitement qu'un conteneur qui s'arrête après avoir tiré le modèle
    # est attendu, pour qui lirait ce fichier en pensant qu'un service qui s'arrête est une
    # panne à corriger.
    restart: "no"

  garage:
    # Version épinglée comme `db` et `rabbitmq`, pas flottante comme `mailpit` : ce n'est
    # pas un outil de développement, c'est le composant dont la compatibilité S3 décide du
    # comportement de l'adapter de stockage.
    image: dxflrs/garage:v2.3.0
    environment:
      # Identifiants du stockage objet des fichiers d'origine. Garage exige un identifiant
      # d'au moins 8 caractères [A-Za-z0-9-_.] et un secret d'au moins 16 caractères ASCII
      # graphiques : en deçà, il refuse de créer la clé et le conteneur ne démarre pas — le
      # message est dans les logs de `garage`, pas dans ceux de l'app. Secrets de
      # développement, du même rang que POSTGRES_PASSWORD, à ne jamais réutiliser ailleurs.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
      # Nom de bucket aux règles S3 : minuscules et tirets, jamais de tiret bas.
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-second-brain-originals}
    # L'image n'a pas d'ENTRYPOINT (son Cmd par défaut est déjà ["/garage", "server"]) :
    # un `command:` sans le chemin du binaire part en recherche de "server" dans le PATH
    # et échoue. --single-node : sans lui un nœud neuf n'a pas de layout et refuse toute
    # écriture. --default-access-key et --default-bucket (Garage v2.3.0) créent la clé et
    # le bucket à partir des trois variables ci-dessus, ce qui dispense d'un conteneur
    # d'amorçage.
    command: ["/garage", "server", "--single-node", "--default-access-key", "--default-bucket"]
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # Image bâtie sur `scratch` : ni shell, ni curl, ni wget, le seul exécutable est le
      # binaire lui-même. D'où CMD et non CMD-SHELL.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Aucun port publié : seuls `app` et `worker` lui parlent, depuis le réseau de la
    # pile. Un port de plus entrerait dans le décalage d'indices du skill `worktree`
    # (voir CLAUDE.md, section « Plusieurs features en parallèle »), sans quoi deux
    # features se le disputeraient. Pour regarder dedans à la main :
    # docker compose exec garage /garage bucket info second-brain-originals

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-second_brain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-second_brain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-second_brain}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-second_brain}
      SECONDBRAIN_BASE_URL: http://localhost:${HTTP_PORT:-8080}
      SECONDBRAIN_JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-second-brain-32-octets}
      OLLAMA_BASE_URL: http://ollama:11434
      SECONDBRAIN_EMBEDDING_MODEL: ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3}
      # Endpoint en dur sur le nom de service, comme les autres adresses internes de ce
      # fichier. Les trois autres variables recopient ce que Garage a reçu pour créer sa
      # clé et son bucket par défaut (voir le service `garage`).
      SECONDBRAIN_S3_ENDPOINT: http://garage:3900
      SECONDBRAIN_S3_BUCKET: ${S3_BUCKET:-second-brain-originals}
      SECONDBRAIN_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      SECONDBRAIN_S3_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
    labels:
      - "traefik.enable=true"
      # /verification est hors /api à dessein : c'est une navigation, pas un appel XHR.
      # Swagger et actuator sont routés ici parce que ce fichier décrit un environnement de
      # développement ; en production le proxy n'expose que /api et /verification.
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/verification`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # Priorité explicite : ne pas dépendre du calcul par longueur de règle de Traefik.
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    volumes:
      # Source montée pour le hot reload (Gradle --continuous + DevTools).
      - ./:/workspace
      # Cache Gradle isolé dans un volume nommé (pas écrit sur l'hôte).
      - gradle-cache:/workspace/.gradle-cache
    healthcheck:
      # Sain = Tomcat écoute, donc build/classes est compilé et chargé. Bash et /dev/tcp
      # plutôt que curl, que l'image temurin n'embarque pas forcément. Le premier démarrage
      # télécharge Gradle et les dépendances : retries généreux plutôt qu'un start_period.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 90
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # Un dépôt sans stockage échoue immédiatement : l'application n'a rien à faire
      # debout avant que Garage le soit.
      garage:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Même image que `app`, second processus, rôle décidé par le profil. Le worker ne compile
    # JAMAIS : `-x compileJava -x processResources` retire les seules tâches qui écriraient
    # dans build/. C'est `app` qui écrit ce répertoire, en continu, et le worker s'y contente
    # de lire — les deux processus Gradle ne partagent donc plus aucune sortie modifiable, et
    # DevTools redémarre le worker sur le .class que `app` vient de recompiler.
    # Le --project-cache-dir isole le répertoire de projet .gradle/ que `app` verrouille
    # (spec, décision 9) ; ça ne suffit pas seul, parce que les deux conteneurs partageraient
    # encore GRADLE_USER_HOME (gradle-cache) et se bloqueraient sur son verrou de journal —
    # la contention passe par un port local, invisible de l'autre conteneur. D'où le second
    # volume ci-dessous. Enfin, `app` sain (voir son healthcheck) garantit que build/classes
    # existe avant que le worker démarre : la course « Main class name has not been
    # configured » ne peut plus l'atteindre.
    command: ["./gradlew", "--no-daemon", "--project-cache-dir", ".gradle-worker", "bootRun", "-x", "compileJava", "-x", "processResources"]
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-second_brain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-second_brain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-second_brain}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-second_brain}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-second_brain}
      SECONDBRAIN_BASE_URL: http://localhost:${HTTP_PORT:-8080}
      SECONDBRAIN_JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-second-brain-32-octets}
      OLLAMA_BASE_URL: http://ollama:11434
      SECONDBRAIN_EMBEDDING_MODEL: ${SECONDBRAIN_EMBEDDING_MODEL:-bge-m3}
      SECONDBRAIN_S3_ENDPOINT: http://garage:3900
      SECONDBRAIN_S3_BUCKET: ${S3_BUCKET:-second-brain-originals}
      SECONDBRAIN_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-second-brain}
      SECONDBRAIN_S3_SECRET_KEY: ${S3_SECRET_KEY:-secret-de-developpement-second-brain}
      # Cache Gradle propre : deux conteneurs qui partagent un GRADLE_USER_HOME se bloquent
      # sur ses verrous (la contention passe par un port local, invisible de l'autre
      # conteneur). Prix : un second téléchargement des dépendances au premier démarrage.
      GRADLE_USER_HOME: /workspace/.gradle-cache-worker
    volumes:
      - ./:/workspace
      - gradle-cache-worker:/workspace/.gradle-cache-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Un dépôt sans stockage échoue immédiatement : l'application n'a rien à faire
      # debout avant que Garage le soit.
      garage:
        condition: service_healthy
      app:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    # npm ci et non npm install : le lock est la référence, et il n'est pas réécrit dans
    # le dépôt monté. node_modules vit dans un volume nommé, pas dans le bind mount —
    # sinon l'arborescence installée en conteneur écraserait celle de l'hôte.
    command: sh -c "npm ci && npm run dev"
    environment:
      # Le client de rechargement à chaud se connecte à l'origine publique, pas au 5173
      # du conteneur, qui n'est plus publié.
      VITE_PUBLIC_PORT: ${HTTP_PORT:-8080}
    labels:
      - "traefik.enable=true"
      # Attrape-tout : tout ce que le back n'a pas réclamé est un chemin de la SPA.
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - app

volumes:
  db-data:
  gradle-cache:
  gradle-cache-worker:
  ollama-models:
  garage-meta:
  garage-data:
  frontend-node-modules:
