# Version catalog — centralises plugin and dependency versions.
# Most Spring versions are managed by the Spring Boot BOM; we only pin
# what the BOM does not cover (plugins, springdoc).

[versions]
springBoot = "4.0.7"
dependencyManagement = "1.1.7"
springdoc = "3.0.3"
spotless = "8.10.0"
# Version of the formatter itself: Spotless resolves it separately, no BOM carries it.
palantirJavaFormat = "2.78.0"
# Text extraction: none of these versions is carried by the Spring Boot BOM.
commonmark = "0.24.0"
poi = "5.5.1"
pdfbox = "3.0.7"
# Token counting: jtokkit is the only Java implementation of OpenAI's BPEs, and
# `cl100k_base` the yardstick the ticket mandates. No BOM carries it.
jtokkit = "1.1.0"
# Object storage: no Spring BOM carries AWS, unlike Flyway or PostgreSQL
# above — so we have to pin it ourselves.
awsSdk = "2.54.11"
# Generation: LangChain4j provides the transport (HTTP, tool-calling protocol,
# streaming) and nothing else — the agent loop stays in the project, see the spec of
# 2026-09-04, decision 12. No Spring BOM carries these modules. LangChain4j's Spring Boot
# starter is NOT used: still at 1.19.0-beta29, and targeting Boot 3.
langchain4j = "1.19.0"

[libraries]
# Flyway: versions aligned by the Spring Boot BOM (do not pin). Since Spring
# Boot 4, the auto-config lives in the dedicated spring-boot-starter-flyway starter;
# flyway-database-postgresql provides the PostgreSQL-specific support.
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Vectors: the module that teaches Hibernate pgvector's `vector` type, hence
# @JdbcTypeCode(SqlTypes.VECTOR) on a float[]. Version aligned by the Spring Boot BOM
# (it follows hibernate-core): do not pin it.
hibernate-vector = { module = "org.hibernate.orm:hibernate-vector" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Markdown: the reference CommonMark parser in Java. It yields headings as
# `Heading` nodes carrying their level, where a regular expression on `^#` would take the
# `#` of a comment inside a code block for a heading.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
# DOCX: POI is the only Java library that reads a Word paragraph's style, hence
# the only one that tells a heading from a bold paragraph.
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
# PDF: PDFBox gives the document outline and, failing that, the font size of every
# glyph — the only two heading clues a PDF can offer (ADR-0027).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# Tokenizer: jtokkit yields `cl100k_base` with no network and no model to download — the
# BPE tables are in the jar. This is NOT bge-m3's tokenizer (see TokenCounter); it is a
# conservative proxy, and that is the very reason the port exists.
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
# Object storage: the AWS BOM holds the versions of its own modules, just as the Spring
# Boot BOM holds flyway-postgresql and postgresql above — so s3 and
# url-connection-client carry no version.ref.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
# This block is the ONLY place where the reasoning about the SDK's HTTP clients lives:
# build.gradle.kts declares the two exclusions and points back here. There used to be two copies,
# asserting the same falsehood fifteen lines apart — a mistake paid for twice.
#
# WHERE THE TWO EXCLUSIONS COME FROM. Not from the pom of software.amazon.awssdk:s3: that one
# mentions neither apache5-client nor netty-nio-client anywhere. The HTTP clients it declares —
# url-connection-client, aws-crt-client, apache-client — are all in <scope>test</scope>,
# so they have no effect on us. It is its PARENT pom, software.amazon.awssdk:services, that declares
# apache5-client and netty-nio-client in its own <dependencies> section (not
# <dependencyManagement>) with <scope>runtime</scope>: a Maven inheritance invisible from the
# pom of s3 alone, but which does land them on runtimeClasspath — as
# `gtest dependencyInsight --dependency software.amazon.awssdk:apache5-client` confirms, tracing
# the request back up to s3.
#
# APACHE5-CLIENT: mandatory exclusion, it settles an active conflict. It requires httpclient5
# 5.6.4, which the io.spring.dependency-management plugin downgrades to 5.5.2 — a property the
# Spring Boot BOM manages for itself, independently of any starter present here (none of them
# depends on it on this branch), and that the plugin imposes anyway on whatever crosses the
# graph. A library compiled against one version and loaded against another, for a
# client we never call. On the way it registers under the same service file
# as url-connection-client (META-INF/services/software.amazon.awssdk.http.SdkHttpService):
# two SYNCHRONOUS clients on the classpath, where the adapter wants only one.
#
# NETTY-NIO-CLIENT: hygiene exclusion, and that must be said as such. It does NOT save
# Netty, which is already on the runtimeClasspath through com.rabbitmq:amqp-client (netty-codec,
# netty-handler, netty-transport — see the same dependencyInsight, on io.netty). And it settles
# no discovery ambiguity: that client registers under
# META-INF/services/software.amazon.awssdk.http.async.SdkAsyncHttpService, the
# ASYNCHRONOUS chain, which the synchronous S3Client never consults. What it buys is more modest
# and enough: the classpath stays at exactly one SDK HTTP client, the one the adapter
# names, rather than at a second one that nothing here builds and that a future S3AsyncClient
# would pick without anyone having decided so.
#
# url-connection-client, for its part, is declared neither by the pom of s3 in compile scope nor by
# the parent services pom: nothing to exclude, everything to declare. It is the only HTTP artifact on
# the classpath once the two exclusions are in place, and it is mandatory, not an optimisation —
# without it, the first call fails on "Unable to load an HTTP implementation from any
# provider in the chain", at the first document upload and not at startup. Preferred over
# apache5-client: outside test scope its pom declares only utils, annotations and
# http-client-spi, so nothing that leaves the SDK. It relies on HttpURLConnection: no
# HTTP/2, no Expect: 100-continue, and the body is buffered in memory. None of the
# three concerns us — an object is a byte[] already in memory, capped at 20 MB by
# spring.servlet.multipart.max-file-size.
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
langchain4j = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
