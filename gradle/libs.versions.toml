# Version catalog — centralise les versions de plugins et dépendances.
# La plupart des versions Spring sont gérées par le BOM Spring Boot ; on ne pin
# que ce qui n'est pas couvert par le BOM (plugins, springdoc).

[versions]
springBoot = "4.0.7"
dependencyManagement = "1.1.7"
springdoc = "3.0.3"
spotless = "8.10.0"
# Version du formateur lui-même : Spotless la résout à part, aucun BOM ne la porte.
palantirJavaFormat = "2.78.0"
# Extraction du texte : aucune de ces versions n'est portée par le BOM Spring Boot.
commonmark = "0.24.0"
poi = "5.5.1"
pdfbox = "3.0.7"
# Comptage de tokens : jtokkit est la seule implémentation Java des BPE d'OpenAI, et
# `cl100k_base` la toise que le ticket impose. Aucun BOM ne la porte.
jtokkit = "1.1.0"
# Stockage objet : aucun BOM Spring ne porte AWS, contrairement à Flyway ou PostgreSQL
# ci-dessus — il faut donc l'épingler nous-mêmes.
awsSdk = "2.54.11"

[libraries]
# Flyway : versions alignées par le BOM Spring Boot (ne pas pinner). Depuis Spring
# Boot 4, l'auto-config vit dans le starter dédié spring-boot-starter-flyway ;
# flyway-database-postgresql fournit le support spécifique PostgreSQL.
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# Vecteurs : le module qui apprend à Hibernate le type `vector` de pgvector, donc
# @JdbcTypeCode(SqlTypes.VECTOR) sur un float[]. Version alignée par le BOM Spring Boot
# (elle suit hibernate-core) : ne pas la pinner.
hibernate-vector = { module = "org.hibernate.orm:hibernate-vector" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Markdown : le parseur de référence CommonMark en Java. Il donne les titres comme des
# nœuds `Heading` avec leur niveau, là où une expression régulière sur `^#` prendrait pour
# un titre le `#` d'un commentaire dans un bloc de code.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
# DOCX : POI est la seule bibliothèque Java qui lise le style d'un paragraphe Word, donc
# la seule qui distingue un titre d'un paragraphe en gras.
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
# PDF : PDFBox donne le sommaire du document et, à défaut, la taille de police de chaque
# glyphe — les deux seules pistes de titre qu'un PDF puisse offrir (ADR-0027).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# Tokenizer : jtokkit rend `cl100k_base` sans réseau ni modèle à télécharger — les tables
# BPE sont dans le jar. Ce n'est PAS le tokenizer de bge-m3 (voir TokenCounter) ; c'est un
# proxy conservateur, et c'est la raison d'être du port.
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
# Stockage objet : le BOM AWS tient les versions de ses propres modules, comme le BOM
# Spring Boot tient flyway-postgresql et postgresql ci-dessus — s3 et
# url-connection-client n'ont donc pas de version.ref.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
# Depuis les versions 2.5x, software.amazon.awssdk:s3 ne déclare plus aucun client HTTP en
# portée compile — apache-client, netty-nio-client et url-connection-client y sont tous en
# <scope>test</scope>, et aucune de ses transitives n'en apporte. Sans ce second artefact,
# le premier appel échoue sur « Unable to load an HTTP implementation from any provider in
# the chain » — au premier dépôt de document, pas au démarrage.
#
# url-connection-client plutôt qu'apache5-client : il ne dépend que de utils, annotations
# et http-client-spi, donc de rien qui sorte du SDK, là où apache5-client ramènerait
# httpclient5 — déjà présent via spring-boot-starter-restclient mais tenu par le BOM
# Spring, et les deux ne s'accorderaient plus. Il s'appuie sur HttpURLConnection : pas
# d'HTTP/2, pas d'Expect: 100-continue, et le corps est tamponné en mémoire. Aucun des
# trois ne nous concerne — un objet est un byte[] déjà en mémoire, plafonné à 20 Mo par
# spring.servlet.multipart.max-file-size.
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
