server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Without this fallback, reloading the page on /login would answer 404: no file
        # bears that name, it is the Vue router that decides what a path is worth.
        try_files $uri $uri/ /index.html;
    }
}
