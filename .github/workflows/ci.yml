name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` déclenche `check`, à laquelle Spotless accroche `spotlessCheck` : du
      # Java mal formaté fait échouer ce job, sans étape dédiée. Les tests utilisent
      # Testcontainers, et Docker est disponible par défaut sur les runners ubuntu-latest.
      - name: Build & test
        run: ./gradlew --no-daemon build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      # Le front n'a pas de compilation à vérifier au-delà du build : les deux comptent.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
