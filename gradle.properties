# google-java-format, que Spotless pilote, analyse le code avec les API internes de javac.
# JEP 396 les a fermées depuis le JDK 16 : sans ces exports, `spotlessApply` échoue sur une
# IllegalAccessError (diffplug/spotless#834). Ils ne concernent que la JVM de build — ni la
# compilation, ni les tests, ni l'application ne s'en servent.
#
# Ce fichier est versionné : la CI en a autant besoin que le poste local, puisque
# `./gradlew build` y déclenche `spotlessCheck`.
org.gradle.jvmargs=--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
