# google-java-format, which Spotless drives, analyses the code with javac's internal APIs.
# JEP 396 has closed them since JDK 16: without these exports, `spotlessApply` fails with an
# IllegalAccessError (diffplug/spotless#834). They only concern the build JVM — neither
# compilation, nor the tests, nor the application use them.
#
# This file is versioned: the CI needs it as much as the local machine, since
# `./gradlew build` triggers `spotlessCheck` there.
org.gradle.jvmargs=--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
