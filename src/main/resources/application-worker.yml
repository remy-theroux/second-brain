# `worker` profile: the same jar, without an HTTP server. Enabled by SPRING_PROFILES_ACTIVE=worker
# (`dev,worker` in compose.yaml). Without a profile, the process is the API — nothing changes for
# an existing deployment.
#
# Cutting Tomcat removes the controllers from the routing, Swagger and the HTTP actuator. What
# remains is common to both roles: buses, JPA, Flyway, storage, mail, event publication. And
# it is here, and only here, that the `@Profile("worker")` listeners exist.
#
# Without Tomcat, what keeps the JVM alive is the listener containers' thread, which
# is not a daemon thread. Were there no listener at all under this profile — a typo
# in a `@Profile("worker")` is enough — the process would not crash: it
# would just stop right after starting up, without an error. That is the symptom to recognise.
spring:
  main:
    web-application-type: none
