spring:
  application:
    name: second-brain

  servlet:
    multipart:
      # The ticket sets the ceiling; `max-request-size` must follow, otherwise it is the one
      # that decides first and the refusal no longer speaks about the file.
      max-file-size: 20MB
      max-request-size: 20MB
      # Defers the multipart resolution to the moment the controller reads its argument,
      # hence AFTER the handler is chosen. Without this, MaxUploadSizeExceededException is raised
      # by DispatcherServlet.checkMultipart while no controller has been designated
      # yet: only a global @RestControllerAdvice would catch it, and this project keeps the
      # translation of refusals next to the route concerned.
      resolve-lazily: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${SPRING_DATASOURCE_USERNAME:second_brain}
    password: ${SPRING_DATASOURCE_PASSWORD:second_brain}

  jpa:
    hibernate:
      # Flyway is the master of the schema; Hibernate merely validates the
      # entities <-> tables correspondence at startup.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Jakarta Mail has no timeout by default: without these three values, a relay
          # that accepts the TCP then stops answering blocks the thread indefinitely.
          # `RegisterUserHandler` sends from inside the transaction opened by
          # `SpringCommandBus`, with a PostgreSQL connection already held: a Hikari pool of 10
          # connections freezes on ten blocked registrations. These timeouts are therefore not
          # optional here.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  http:
    clients:
      # Governs every RestClient of the project — OllamaEmbeddingAdapter and the two Google calls
      # of GoogleDriveAuthorizationAdapter — hence a global setting rather than a named client
      # each. Same status as the Jakarta Mail timeouts and the RabbitMQ
      # connection-timeout below: without it, an Ollama that accepts the
      # TCP connection then stops answering freezes the worker thread forever — the
      # only thread that consumes domain.knowledge.events — without a log, without FAILED, without
      # a retry, since nothing raises an exception. Short connect-timeout: either
      # Ollama is listening, or it is not. read-timeout deliberately generous, chosen to
      # detect a frozen service and not to bound a normal processing: a batch of 32
      # chunks through bge-m3 on CPU can legitimately take close to a minute.
      connect-timeout: 5s
      read-timeout: 120s

  rabbitmq:
    # Same status as the datasource: the default serves development outside a container,
    # compose.yaml sets the real ones. guest/guest are the default credentials of the
    # official image — which accepts them from the whole network, not only on loopback — and they
    # no longer exist as soon as the broker is created with its own, which compose.yaml does:
    # a deployment sets the four variables, without which nothing connects.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # The RabbitMQ client waits 60 s before giving up on a dead connection, and the
    # publication runs inside afterCommit — BEFORE the JDBC connection is returned to the pool.
    # Ten uploads against an unreachable broker would freeze the Hikari pool for a whole minute,
    # exactly the failure that the timeouts of the mail block above already avoid.
    connection-timeout: 5s
    template:
      retry:
        # Explicit because ADR-0023 depends on it: no retry,
        # an event the broker did not receive is lost, and that is accepted.
        enabled: false
    listener:
      simple:
        # A message whose processing raises an exception is rejected WITHOUT being requeued.
        # The default (true) would put it back at the head of the queue and reprocess it endlessly: a
        # PDF that crashes the extractor would block the worker forever. No
        # dead-letter queue and no retry (spec, decision 7): a failure must end up as FAILED
        # on the document, not be replayed.
        default-requeue-rejected: false
        # Explicit rather than implicit: the idempotence of KnowledgeEventListener rests on
        # a single consumer at a time. Its handlers delete then rewrite behind
        # UNIQUE constraints — correct for a sequential redelivery, but two
        # simultaneous deliveries of the same event would both delete and write,
        # and would collide with one another on those constraints instead of replacing each other
        # cleanly.
        concurrency: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    rabbit:
      # The broker does not enter /actuator/health: restarting the API does not repair a
      # broker, and the API serves everything else without it. A failure shows up in the logs
      # (ERROR on each lost publication) and in the documents that stay PENDING —
      # see ADR-0023.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Application properties. `base-url` is the public URL as the user sees it
# in their browser: it is the one written into the notification links.
secondbrain:
  base-url: ${SECONDBRAIN_BASE_URL:http://localhost:8080}
  storage:
    # Where the original files are kept, one object per document, the key being its
    # identifier. The first four properties DELIBERATELY have no default, the same
    # status as `jwt.secret` just below and the opposite of `base-url` above, whose
    # default lies in production (ADR-0009): here a default would not lie, it would lose
    # the documents silently — the first upload would write into a bucket that is not the
    # right one, and nobody would notice before the first re-read of an original.
    # compose.yaml provides the development values; any deployment outside Compose must
    # set them, without which the application refuses to start.
    #
    # Accepted limitation: `endpoint` being mandatory, native AWS S3 cannot be targeted, as it
    # does without endpointOverride. That is consistent with production not being
    # covered by this ticket; making it optional will be a one-liner, the day it comes up.
    s3:
      endpoint: ${SECONDBRAIN_S3_ENDPOINT}
      bucket: ${SECONDBRAIN_S3_BUCKET}
      access-key: ${SECONDBRAIN_S3_ACCESS_KEY}
      secret-key: ${SECONDBRAIN_S3_SECRET_KEY}
      # A default, because this value designates nothing: SigV4 requires a region name
      # in the signature even when the service only has one. It must stay equal to the
      # `s3_region` of docker/garage.toml — Garage rejects a signature computed for a
      # region other than its own.
      region: ${SECONDBRAIN_S3_REGION:garage}
      # Path-style addressing (`host/bucket/key`) is the only one that works without a
      # wildcard DNS `*.bucket.host`, which no development machine has. S3 itself still accepts
      # it, so this default closes nothing.
      path-style: ${SECONDBRAIN_S3_PATH_STYLE:true}
  embedding:
    # Where to reach the vectorisation service. Like the datasource, the default serves
    # development outside a container — 11434 is Ollama's port. In production, the variable
    # will target the Ollama already in place rather than a second one, shipped for nothing.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # The model, and it alone, is configurable. Its DIMENSION is not: it lives in
    # EmbeddingPolicy, because it is the contract between the model, the column and the index.
    # Changing model is a migration and a reindexing, not a variable.
    model: ${SECONDBRAIN_EMBEDDING_MODEL:bge-m3}
  llm:
    # Where to reach the generation service. Same Ollama as the embedding, and the same status
    # of default: it serves development outside a container.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # The model, and it alone, is configurable. Its TEMPERATURE is not: it lives in
    # DocumentAgent, because it is part of the way the agent answers.
    model: ${SECONDBRAIN_LLM_MODEL:qwen3:4b}
  notification:
    from: ${SECONDBRAIN_NOTIFICATION_FROM:no-reply@second-brain.localhost}
  drive:
    # The OAuth client of the Google Cloud project, and the redirect URI it must declare is
    # `base-url` + /drive/callback. Empty by default, unlike the key below: without them only
    # the Drive connection fails, and it fails loudly at the first consent.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Enciphers the Google refresh token at rest, through RefreshTokenAttributeConverter.
    # Deliberately without a default value, the same status as `jwt.secret` below: a default
    # key would be a public key, and a dump would give back every connected Drive.
    # 32 bytes encoded in Base64 — AES-256.
    token-encryption-key: ${SECONDBRAIN_DRIVE_TOKEN_KEY}
  jwt:
    # Deliberately without a default value: a default signing secret would be
    # a public secret. Without SECONDBRAIN_JWT_SECRET, the application refuses to start —
    # unlike base-url above, whose default lies in production (ADR-0009).
    # 32 bytes minimum: HS256 requires a 256-bit key.
    secret: ${SECONDBRAIN_JWT_SECRET}
