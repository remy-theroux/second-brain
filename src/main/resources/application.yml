spring:
  application:
    name: second-brain

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${SPRING_DATASOURCE_USERNAME:second_brain}
    password: ${SPRING_DATASOURCE_PASSWORD:second_brain}

  jpa:
    hibernate:
      # Flyway est maître du schéma ; Hibernate se contente de valider la
      # correspondance entités <-> tables au démarrage.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      # Utilisateur par défaut pour l'authentification HTTP Basic (à remplacer).
      name: ${APP_ADMIN_USER:admin}
      password: ${APP_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
