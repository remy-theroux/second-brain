spring:
  application:
    name: second-brain

  servlet:
    multipart:
      # Le ticket fixe le plafond ; `max-request-size` doit suivre, sinon c'est lui qui
      # tranche le premier et le refus ne parle plus du fichier.
      max-file-size: 20MB
      max-request-size: 20MB
      # Repousse la résolution du multipart au moment où le contrôleur lit son argument,
      # donc APRÈS le choix du handler. Sans ça, MaxUploadSizeExceededException est levée
      # par DispatcherServlet.checkMultipart alors qu'aucun contrôleur n'est encore
      # désigné : seul un @RestControllerAdvice global la capterait, et ce projet garde la
      # traduction des refus auprès de la route concernée.
      resolve-lazily: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${SPRING_DATASOURCE_USERNAME:second_brain}
    password: ${SPRING_DATASOURCE_PASSWORD:second_brain}

  jpa:
    hibernate:
      # Flyway est maître du schéma ; Hibernate se contente de valider la
      # correspondance entités <-> tables au démarrage.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Jakarta Mail n'a par défaut aucun timeout : sans ces trois valeurs, un relais
          # qui accepte le TCP puis ne répond plus bloque le thread indéfiniment.
          # `RegisterUserHandler` envoie depuis l'intérieur de la transaction ouverte par
          # `SpringCommandBus`, connexion PostgreSQL déjà tenue : un pool Hikari de 10
          # connexions se fige en dix inscriptions bloquées. Ces timeouts ne sont donc pas
          # optionnels ici.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  rabbitmq:
    # Même statut que la datasource : le défaut sert le développement hors conteneur,
    # compose.yaml pose les vrais. guest/guest sont les identifiants par défaut de l'image
    # officielle — qui les accepte depuis tout le réseau, pas seulement en loopback — et ils
    # n'existent plus dès que le broker est créé avec les siens, ce que compose.yaml fait :
    # un déploiement pose les quatre variables, sans quoi rien ne se connecte.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Le client RabbitMQ attend 60 s avant d'abandonner une connexion morte, et la
    # publication tourne dans afterCommit — AVANT que la connexion JDBC soit rendue au pool.
    # Dix dépôts contre un broker injoignable figeraient le pool Hikari une minute entière,
    # exactement la panne que les timeouts du bloc mail ci-dessus évitent déjà.
    connection-timeout: 5s
    template:
      retry:
        # Explicite parce qu'ADR-0023 en dépend : pas de nouvel essai,
        # un événement que le broker n'a pas reçu est perdu, et c'est assumé.
        enabled: false
    listener:
      simple:
        # Un message dont le traitement lève une exception est rejeté SANS remise en file.
        # Le défaut (true) le remettrait en tête de file et le retraiterait sans fin : un
        # PDF qui fait planter l'extracteur bloquerait le worker pour toujours. Pas de
        # dead-letter queue ni de retry (spec, décision 7) : un échec doit finir en FAILED
        # sur le document, pas être rejoué.
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    rabbit:
      # Le broker n'entre pas dans /actuator/health : redémarrer l'API ne répare pas un
      # broker, et l'API sert tout le reste sans lui. Une panne se voit dans les logs
      # (ERROR à chaque publication perdue) et dans les documents qui restent PENDING —
      # voir ADR-0023.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Propriétés applicatives. `base-url` est l'URL publique telle que l'utilisateur la voit
# dans son navigateur : c'est elle qui est écrite dans les liens des notifications.
secondbrain:
  base-url: ${SECONDBRAIN_BASE_URL:http://localhost:8080}
  storage:
    # Où sont conservés les fichiers d'origine, un par document, nommés par son
    # identifiant. Comme `base-url`, le défaut sert le développement : hors conteneur,
    # `/data` n'est pas écrivable, et c'est SECONDBRAIN_ORIGINALS_PATH qui fait foi.
    originals-path: ${SECONDBRAIN_ORIGINALS_PATH:/data/originals}
  notification:
    from: ${SECONDBRAIN_NOTIFICATION_FROM:no-reply@second-brain.localhost}
  jwt:
    # Volontairement sans valeur par défaut : un secret de signature par défaut serait
    # un secret public. Sans SECONDBRAIN_JWT_SECRET, l'application refuse de démarrer —
    # à l'inverse de base-url ci-dessus, dont le défaut ment en production (ADR-0009).
    # 32 octets minimum : HS256 exige une clé de 256 bits.
    secret: ${SECONDBRAIN_JWT_SECRET}
