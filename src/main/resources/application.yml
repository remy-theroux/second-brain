spring:
  application:
    name: second-brain

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${SPRING_DATASOURCE_USERNAME:second_brain}
    password: ${SPRING_DATASOURCE_PASSWORD:second_brain}

  jpa:
    hibernate:
      # Flyway est maître du schéma ; Hibernate se contente de valider la
      # correspondance entités <-> tables au démarrage.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Jakarta Mail n'a par défaut aucun timeout : sans ces trois valeurs, un relais
          # qui accepte le TCP puis ne répond plus bloque le thread indéfiniment.
          # `RegisterUserHandler` envoie depuis l'intérieur de la transaction ouverte par
          # `SpringCommandBus`, connexion PostgreSQL déjà tenue : un pool Hikari de 10
          # connexions se fige en dix inscriptions bloquées. Ces timeouts ne sont donc pas
          # optionnels ici.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Propriétés applicatives. `base-url` est l'URL publique telle que l'utilisateur la voit
# dans son navigateur : c'est elle qui est écrite dans les liens des notifications.
secondbrain:
  base-url: ${SECONDBRAIN_BASE_URL:http://localhost:8080}
  notification:
    from: ${SECONDBRAIN_NOTIFICATION_FROM:no-reply@second-brain.localhost}
