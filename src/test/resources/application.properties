# Doublon volontaire de la variable d'environnement posée sur la tâche Test de
# build.gradle.kts : celle-ci ne s'applique qu'aux exécutions par Gradle. Cette ligne
# couvre les lancements depuis l'IDE (tests, et `TestSecondBrainApplication`), qui ne
# passent pas par Gradle. 32 octets minimum, HS256.
secondbrain.jwt.secret=secret-de-test-second-brain-32-octets-minimum

# Les trois conteneurs (PostgreSQL, RabbitMQ, Garage) démarrent désormais de front plutôt
# qu'en séquence : à trois images, leur somme s'ajouterait au temps de démarrage de chaque
# contexte Spring.
spring.testcontainers.beans.startup=parallel
