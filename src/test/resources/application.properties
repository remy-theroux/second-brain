# Deliberate duplicate of the environment variable set on the Test task of
# build.gradle.kts: that one only applies to runs through Gradle. This line
# covers launches from the IDE (tests, and `TestSecondBrainApplication`), which do
# not go through Gradle. 32 bytes minimum, HS256.
secondbrain.jwt.secret=secret-de-test-second-brain-32-octets-minimum
# Same double path for the Drive encryption key: 32 bytes in Base64, AES-256.
secondbrain.drive.token-encryption-key=Y2xlLWRlLXRlc3QtZHJpdmUtc2Vjb25kLWJyYWluMzI=

# The three containers (PostgreSQL, RabbitMQ, Garage) now start up front rather
# than in sequence: with three images, their sum would add up to the startup time of every
# Spring context.
spring.testcontainers.beans.startup=parallel

# The clock must never be what triggers a test: the scheduled round is pushed far beyond any
# suite, and DriveSynchronisationTest publishes its event by hand.
secondbrain.drive.synchronisation-interval=PT24H
